version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: taskbridge_web_1
      APP_PORT: 3737
      # Google's OAuth redirect lands here from Google's own server, not a
      # logged-in browser session -- it must reach TaskBridge directly rather
      # than bounce through Umbrel's login wall.
      PROXY_AUTH_WHITELIST: "/oauth/*"

  web:
    image: ghcr.io/payam-ghavi/taskbridge:2.0.3
    restart: on-failure
    stop_grace_period: 20s
    environment:
      PORT: 3737
      TASKBRIDGE_DATA: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
