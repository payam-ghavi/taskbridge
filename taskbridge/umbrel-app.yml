id: taskbridge
name: TaskBridge
tagline: Sync tasks across Microsoft To Do, Todoist, and Google Tasks
icon: https://raw.githubusercontent.com/payam-ghavi/taskbridge/main/taskbridge/icon.svg
category: automation
version: "2.0.17"
port: 3737
description: >-
  TaskBridge keeps your tasks in sync across Microsoft To Do, Todoist, and
  Google Tasks — connect any two, or all three. Add or check off a task in
  one and it shows up in the others within a minute.


  What it syncs: task title, notes, due date, completion, and priority (as
  an "important" flag — Google Tasks has no priority field, so it just
  won't carry one). Due time syncs too, but only between Todoist and
  Microsoft To Do — Google Tasks' own API never exposes a time, either
  direction, so that part is a Google limitation TaskBridge can't work
  around. Lists/projects are matched by name; a missing one is created on
  connect. Completing or deleting a task does the same everywhere it's
  linked — and so does deleting a whole list or project.


  Setup: paste a Todoist API token, sign in to Microsoft by entering a short
  code (no Azure account needed), and optionally connect Google Tasks (needs
  a one-time free Google Cloud OAuth app of your own — the setup page walks
  through it). Everything runs on your Umbrel; the only outbound traffic is
  to the apps you connect.


  Not synced: sub-tasks / checklist items, and recurrence rules (a recurring
  task still syncs its next due date).
