releaseNotes: >-
  2.0.17: fixes a second due-time timezone bug — a Todoist task due "10:00
  AM" (your own local time) was landing on Microsoft To Do as 3:00 AM.
  Unlike Microsoft and Google, Todoist's due time is a floating local value
  with no fixed zone of its own; it was being mislabeled UTC on the way out.
  Now converted properly using the task's own timezone, or your Todoist
  account's timezone as a fallback, before it's sent anywhere else.


  2.0.16: documentation fix — the "due date and time syncs everywhere" claim
  from 2.0.4 overstated it. Time-of-day genuinely only syncs between Todoist
  and Microsoft To Do; Google Tasks' own API never exposes a time in either
  direction, confirmed by testing a task added directly in Google. No code
  change, just correcting what the app says it does.


  2.0.15: fixes the actual root cause behind the "Flagged Emails" mystery —
  two lists with the same name on one connected app (a leftover duplicate)
  made pairing flip-flop between them forever, every single cycle, and
  never settle. A list pairing now sticks to whichever list won it first;
  if a genuine duplicate exists, TaskBridge now says so plainly in Activity
  instead of silently looping. If you see that message, delete the extra
  duplicate list on that app.


  2.0.13: failures that used to only go to the container's own console (a
  rejected Todoist change, a list that couldn't be created to match another
  app, a task update that failed) now always show up in the Activity feed
  too, with the real reason from the provider where available — not just a
  generic "sync failed." Meant to stay permanently, not just while chasing a
  specific bug.


  2.0.11: a list's existence check came back negative for one cycle on a
  real account (a transient API hiccup, not an actual deletion) and 2.0.8's
  same-cycle trigger acted on it immediately, briefly un-pairing lists that
  were never actually deleted (self-healed the next cycle, nothing was
  lost — Todoist and Microsoft both refuse to delete a default/protected
  list anyway, which is what saved it here). A list must now be missing on
  two consecutive cycles before anything gets deleted, so a single bad API
  response can never trigger a cross-platform deletion again.


  2.0.10: fixes a real-world case that slipped past 2.0.9 — when the mirror
  list delete itself was rejected by a provider (seen live: Microsoft Graph
  returned a 400 trying to delete a list), that failure crashed the whole
  sync instead of being treated as best-effort. It's now caught, logged, and
  the affected list is simply re-paired fresh next cycle instead of taking
  every provider's sync down with it. Also wraps list reconciliation as a
  whole so no future surprise there can do the same.


  2.0.9: hardens 2.0.8's deletion propagation against the case where the
  same task or list is deleted on two apps in the very same sync cycle — a
  provider's stale pre-cycle snapshot of an item another provider's
  deletion had already cleaned up could otherwise get treated as a brand
  new task and resurrected.


  2.0.8: deleting a list or project on one app now deletes the matching one
  (and everything in it) on every other connected app, instead of leaving a
  dangling link — which previously could make sync fail outright with a
  "list not found" error until the pairing was manually reset. Sync now
  detects and cleans this up on its own.


  2.0.7: removes the temporary diagnostic logging added in 2.0.5/2.0.6 while
  chasing the timezone bug below — no functional change.


  2.0.6: fixes a timezone bug from 2.0.4's due-time sync — a time coming from
  Microsoft's "Remind me" (always reported in UTC) was being written to
  Todoist as if it were already local time, so e.g. 11:00 AM showed up as
  6:00 PM. Todoist writes now explicitly mark the value as UTC so it converts
  correctly.


  2.0.4: due date AND time now sync, not just the date. In Microsoft To Do
  specifically, a time comes from "Remind me" (its only date control with a
  real time picker) — it wins over a plain "Add due date" when both are set,
  and gets mirrored back onto To Do's own reminder so it's visible there too.
  Also fixes a bug where a Microsoft-sourced due date could fail to reach
  Todoist/Google Tasks at all when it only had a reminder set, not a due date.


  2.0.3: fixes a bug where Todoist's sync cursor was never actually reused —
  every cycle re-fetched Todoist's entire task list instead of just what
  changed. With Todoist as the (default) conflict winner, that made it look
  like Todoist had "also touched" every task group every cycle, silently
  discarding real completions and edits made in Microsoft To Do or Google
  Tasks. Fixed; no action needed after updating.


  2.0.2: fixes a bug where a provider connected after the other two already
  had a default list group (the common order: Todoist + Microsoft first,
  Google Tasks later) got its own default list ("My Tasks", "Inbox", etc.)
  siloed into a separate, disconnected group instead of joining the existing
  one — so tasks added directly in that app's default list never synced.
  After updating, use Settings → "Reset sync state" once to re-pair lists
  correctly (your tasks aren't touched).


  2.0.1: fixes Google sign-in behind a reverse proxy (Umbrel's app_proxy
  included) — TaskBridge's own address is now set explicitly instead of
  auto-detected, which the proxy was silently getting wrong.


  2.0.0: Google Tasks joins Microsoft To Do and Todoist as a third connector
  — sync any two, or all three, together. Internals reworked to support any
  number of connected apps, not just a fixed pair.
