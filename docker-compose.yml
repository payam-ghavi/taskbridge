# TaskBridge — standalone (any Docker host).
# For Umbrel, install from the App Store instead; see README.
services:
  taskbridge:
    image: ghcr.io/payam-ghavi/taskbridge:latest   # also: payamghavi/taskbridge:latest (Docker Hub)
    container_name: taskbridge
    restart: unless-stopped
    ports:
      - "3737:3737"
    volumes:
      - ./data:/data                            # holds state.db — back this up
